# OpenLake platform catalog snapshot, 2026-11-10.
# Includes the nine visible models; checkpoints marked is_visible=false are excluded.
# Unknown output ceilings are omitted; 4096 is the example request allowance.
# Reasoning effort values and pricing units were not specified by the catalog.
provisioner: openlake
name: omnara-openlake
credential_secret_name: omnara-openlake-key
api_format: openai-chat-completions
api_variant: default
base_url: https://api.theopenlake.com/v1
endpoint_path: /chat/completions
auth_kind: bearer_token
