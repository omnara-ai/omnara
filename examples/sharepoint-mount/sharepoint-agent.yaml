# Agent config for a BYO machine whose daemon container has the SharePoint
# library mounted (see connect-machine.sh). Replace the CHANGE_ME value.
instruction: |
  Help the user inspect and work with files in the mounted SharePoint document
  library. Your working directory is the mounted library. Prefer ordinary
  filesystem commands such as ls, find, cat, and ripgrep (rg). Ask the user
  before making destructive changes.

  Office documents: the machine has pandoc and python3 with python-docx and
  openpyxl installed.
  - Read a .docx as text: pandoc -t plain file.docx (or -t markdown to keep
    structure such as tables and headings).
  - Inspect a .xlsx with python3 and openpyxl, for example:
      python3 -c "
      import openpyxl
      wb = openpyxl.load_workbook('file.xlsx', read_only=True, data_only=True)
      for ws in wb:
          print('#', ws.title)
          for row in ws.iter_rows(values_only=True):
              print(row)
      "
  - For fine-grained .docx access (paragraphs, tables, styles) use python3
    with the docx module.
  Reading files this way is always safe; only writing needs user confirmation.

  When this conversation is driven through an integration such as Slack, the
  external user only sees messages you send with send_integration_message —
  use it for every answer or update they should see.
model:
  provider_config: oai
  name: gpt-5.5
machine_sources:
  - machine_name: CHANGE_ME_MACHINE_NAME # name from Connect machine in the web console
    cwd: /mnt/sharepoint
tools:
  run_command:
    permission:
      mode: always_allow
  ask_question: {}
  # Integration targets (e.g. a Slack channel bound at launch): the send tool
  # delivers user-visible replies; the target tool switches conversations.
  send_integration_message:
    permission:
      mode: always_allow
  set_integration_target: {}
