version: v1
instruction: Use text_length to count the Unicode code points in the user's text, then report the result.
model:
  provider_config: omnara-openrouter
  name: openai/gpt-5.6-sol
tools:
  text_length:
    type: custom
    description: Count Unicode code points in a string.
    input_schema:
      type: object
      properties:
        text:
          type: string
      required: [text]
      additionalProperties: false
event_webhook:
  url: https://YOUR-PUBLIC-HOST/webhook
  signing_secret_id: sec_REPLACE_ME
  events: [tool_call_update]
