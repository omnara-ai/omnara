openapi: 3.1.0
info:
  title: Compatibility fixture
  version: enum-breaking
paths:
  /api/v1/resources:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: string
                    minLength: 1
                  code:
                    type: string
                    enum: [existing, added]
  /api/v1/unchanged:
    get:
      responses:
        '200':
          description: OK
