pools:
  - name: default-pool
    description: Omnara-hosted Unikraft agent machines
    provider: unikraft
    provider_auth_env_var: UNIKRAFT_API_TOKEN
    default_machine_cpu: 2
    default_machine_memory_mb: 4096
    default_machine_provider_options:
      image: registry.example.com/omnara/agent-sandbox:latest
      metro: sfo
    default_cwd: /
    max_total_machines: 10
    max_total_cpu: 20
    max_total_memory_mb: 40960
    max_machine_cpu: 4
    max_machine_memory_mb: 8192
