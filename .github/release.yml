# Configuration for GitHub auto-generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Categories are driven by PR labels. Labels are applied automatically from
# conventional-commit PR titles by .github/workflows/pr-type-label.yaml.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚀 Features
      labels:
        - feat
    - title: 🐛 Bug Fixes
      labels:
        - fix
    - title: ⚡ Performance
      labels:
        - perf
    - title: 🔒 Security
      labels:
        - security
    - title: 📚 Documentation
      labels:
        - docs
    - title: 🧰 Maintenance
      labels:
        - refactor
        - chore
        - build
        - ci
        - test
        - style
    # Dependabot PRs carry only the `dependencies`/`github_actions` labels
    # (pr-type-label.yaml skips them), so they land here and nowhere else.
    - title: 📦 Dependencies
      labels:
        - dependencies
        - github_actions
    - title: Other Changes
      labels:
        - "*"
