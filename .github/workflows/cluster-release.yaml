name: Release cluster

on:
  push:
    tags:
      - 'cluster-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: cluster-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: ghcr.io/omnara-ai/omnara-web
          - name: api
            image: ghcr.io/omnara-ai/omnara-api
          - name: worker
            image: ghcr.io/omnara-ai/omnara-worker
          - name: maintenance
            image: ghcr.io/omnara-ai/omnara-maintenance
          - name: migrations
            image: ghcr.io/omnara-ai/omnara-migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release source
        id: release
        run: go run ./tools/cluster-release resolve

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check immutable image tag
        env:
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: go run ./tools/cluster-release check-tag

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sync MCP registry snapshot
        if: matrix.name == 'api'
        run: go run ./tools/mcp-registry-sync -out "${{ github.workspace }}/mcp-registry-snapshot/mcp-registry.json"

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ steps.release.outputs.source_commit }}
            index:org.opencontainers.image.version=${{ steps.release.outputs.version }}
          build-contexts: ${{ matrix.name == 'api' && 'mcp-registry-snapshot=./mcp-registry-snapshot' || '' }}
          context: .
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source_commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ${{ matrix.image }}:${{ steps.release.outputs.version }}
            ${{ matrix.image }}:latest
          target: ${{ matrix.name }}

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          NAME: ${{ matrix.name }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: go run ./tools/cluster-release record --dir cluster-digest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-digest-${{ matrix.name }}
          path: cluster-digest/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cluster-digest-*
          path: cluster-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create cluster release manifest
        id: manifest
        run: go run ./tools/cluster-release generate --dir cluster-digests

      - name: Verify anonymous image access
        run: go run ./tools/cluster-release verify-public --manifest cluster-release.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" cluster-release.json --clobber && gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false --prerelease=false --notes-file release-notes.md --title "cluster $VERSION" --verify-tag; else gh release create "$GITHUB_REF_NAME" cluster-release.json --latest=false --notes-file release-notes.md --title "cluster $VERSION" --verify-tag; fi

      - name: Publish documentation
        env:
          DOCS_BRANCH: docs-production
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit=$(jq -er '.source_commit' cluster-release.json)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$DOCS_BRANCH" -f sha="$source_commit" -F force=false
