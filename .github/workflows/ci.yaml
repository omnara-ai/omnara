name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-verify-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-verify-

      - id: golangci-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/custom-golangci-lint
          key: custom-golangci-lint-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('.custom-gcl.yml', 'tools/ci/go.mod', 'tools/ci/go.sum', 'tools/omnaralint/go.mod', 'tools/omnaralint/go.sum', 'tools/omnaralint/**/*.go') }}

      - run: touch .tools/custom-golangci-lint
        if: steps.golangci-cache.outputs.cache-hit == 'true'

      - run: make verify-static

      - name: Validate delivery alert rules
        run: make prometheus-check

      - name: Protect released migrations and check API compatibility
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          COMPAT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make compatibility-check

      - run: make govulncheck

  go-tests:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - label: Unit Tests
            target: unit
          - label: Unit Race Tests
            target: race-unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-tests-${{ matrix.target }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-tests-${{ matrix.target }}-

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep gcc libc6-dev

      - run: make ${{ matrix.target }}

  container-images:
    name: Container Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [web, api, maintenance, migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - run: docker build --target ${{ matrix.target }} --tag omnara-${{ matrix.target }}:ci .

      - name: Verify Compose web and gateway
        if: matrix.target == 'web'
        run: |
          docker compose --profile app up --build --no-deps --detach web gateway
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --retry-max-time 60 http://localhost:8000/ > /dev/null

      - name: Stop Compose web services
        if: always() && matrix.target == 'web'
        run: docker compose --profile app down

  worker-image:
    name: Worker Image Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - run: make test-worker-image

  daemon-darwin:
    name: Daemon macOS Tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./internal/machinedaemon ./cmd/daemon ./internal/omnarad

  control-plane-windows:
    name: Control Plane Windows Tests
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare native file tools and NTFS temporary storage
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'omnara-file-tools'
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $rgArchive = Join-Path $toolRoot 'ripgrep.zip'
          Invoke-WebRequest 'https://github.com/BurntSushi/ripgrep/releases/download/16.0.0/ripgrep-16.0.0-x86_64-pc-windows-msvc.zip' -OutFile $rgArchive
          if ((Get-FileHash $rgArchive -Algorithm SHA256).Hash -ne 'f418ae83e63046a94a7b5f3a44bf3a169f66e689164856ecee02547131c73931') { throw 'ripgrep hash mismatch' }
          Expand-Archive $rgArchive -DestinationPath $toolRoot
          Copy-Item "$toolRoot\ripgrep-16.0.0-x86_64-pc-windows-msvc\rg.exe" $toolRoot
          $msysArchive = Join-Path $toolRoot 'msys2.exe'
          Invoke-WebRequest 'https://github.com/msys2/msys2-installer/releases/download/2026-11-20/msys2-base-x86_64-20261120.sfx.exe' -OutFile $msysArchive
          if ((Get-FileHash $msysArchive -Algorithm SHA256).Hash -ne '4f6dadfdb2c9be5fc1938e30b635cb72bb4344c35e8b6fd225bc3250fcab5897') { throw 'MSYS2 hash mismatch' }
          & $msysArchive -y "-o$toolRoot\msys" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 extraction failed' }
          foreach ($name in @('sed.exe', 'msys-2.0.dll', 'msys-intl-8.dll', 'msys-iconv-2.dll')) {
            Copy-Item "$toolRoot\msys\msys64\usr\bin\$name" $toolRoot
          }
          $toolRoot >> $env:GITHUB_PATH
          # Hosted Windows D: is moving to ReFS; memory tests require NTFS.
          $testTemp = 'C:\omnara-test-temp'
          if (([IO.DriveInfo]::new('C:\')).DriveFormat -ne 'NTFS') { throw 'Tests require an NTFS volume' }
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV

      - name: Parse Windows installers and documentation with PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem deploy/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          Get-ChildItem docs/self-hosting -Filter 'windows*.mdx' | ForEach-Object {
            $content = [IO.File]::ReadAllText($_.FullName)
            $blocks = [regex]::Matches($content, '(?ms)^```powershell\r?\n(.*?)^```')
            if (-not $blocks.Count -or $blocks.Count -ne [regex]::Matches($content, '(?m)^\s*```powershell\b').Count) {
              throw "Unrecognized PowerShell fence in $($_.Name)"
            }
            foreach ($block in $blocks) {
              $tokens = $null
              $parseErrors = $null
              [void][Management.Automation.Language.Parser]::ParseInput($block.Groups[1].Value, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
            }
          }

      - name: Check Windows installer port validation
        shell: powershell
        run: |
          function Assert-Rejected($Script, $Parameters, $Message) {
            $failure = $null
            try { & $Script @Parameters } catch { $failure = $_.Exception.Message }
            if (-not $failure -or $failure -notlike $Message) { throw "Expected '$Message', got '$failure'" }
          }
          $installer = '.\deploy\windows\Install-Services.ps1'
          $iis = '.\deploy\windows\Configure-IIS.ps1'
          $parameters = @{
            BinaryDirectory = 'unused'; FileToolsDirectory = 'unused'
            EnvironmentFile = 'unused'; WinSWPath = 'unused'
          }
          $ports = @('ApiPort', 'ApiMetricsPort', 'WorkerMetricsPort', 'MaintenanceMetricsPort')
          foreach ($port in $ports) {
            foreach ($value in @(0, 65536)) {
              $case = $parameters.Clone()
              $case[$port] = $value
              Assert-Rejected $installer $case "Cannot validate argument on parameter '$port'.*"
            }
          }
          foreach ($port in @('Port', 'BackendPort')) {
            foreach ($value in @(0, 65536)) {
              Assert-Rejected $iis @{ $port = $value } "Cannot validate argument on parameter '$port'.*"
            }
          }
          $case = $parameters.Clone()
          $case.ApiPort = 8081
          Assert-Rejected $installer $case '*must be distinct.*'
          Assert-Rejected $iis @{ Port = 8090; BackendPort = 8090 } 'Port and BackendPort must be different.'
          $listener = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Any, 0)
          try {
            $listener.Start()
            $port = $listener.LocalEndpoint.Port
            $case = $parameters.Clone()
            $case.WorkerMetricsPort = $port
            Assert-Rejected $installer $case "Required Omnara ports are already in use:*$port*"
            Assert-Rejected $iis @{ Port = $port } "IIS port $port is already in use.*"
            $listener.Stop()
            $listener = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
            $listener.Start()
            Assert-Rejected $iis @{ BackendPort = $listener.LocalEndpoint.Port } 'omnara-api must be listening on*'
          } finally {
            $listener.Stop()
          }

      - name: Test Windows storage, file tools, configuration, and process helpers
        run: go test -count=1 -v ./internal/config ./internal/storage/internal/memoryops ./internal/storage/memorystore ./internal/harness/tools ./internal/sandbox ./internal/testutil/integrationdb ./internal/testutil/integrationlock

      - name: Test Windows scripted edit limits
        run: go test -count=1 -v '-tags=integration' -run '^TestEditFileTextLimits$' ./internal/harness/tools

      - name: Compile and vet Windows integration and service tests
        run: go vet '-tags=integration,servicee2e,webe2e' ./internal/e2e ./internal/harness/tools ./internal/httpapi ./internal/storage/... ./internal/blobstore ./internal/httpapi/auth ./internal/notifications ./internal/redistore

  windows-bundle:
    uses: ./.github/workflows/windows-bundle.yaml

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: make web-static-check

  web-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-frontend-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-frontend-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: make web-e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report
            frontend/apps/web/test-results
          retention-days: 7

      - run: make build-api-from-dist

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres redis

      - name: Stop test database
        if: always()
        run: docker compose down -v

  integration:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - label: Database Contract Checks
            target: test-database-contracts
          - label: Storage Integration Tests
            target: test-integration-storage
          - label: HTTP API Integration Tests
            target: test-integration-httpapi
          - label: Runtime Integration Tests
            target: test-integration-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.target }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-integration-${{ matrix.target }}-

      - name: Install file tools
        if: matrix.target == 'test-integration-runtime'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep sed libcap2-bin
          make install-chroot-sandbox

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: matrix.target == 'test-integration-httpapi'
        with:
          node-version-file: .node-version

      - run: corepack enable
        if: matrix.target == 'test-integration-httpapi'

      - uses: ./.github/actions/setup-test-db

      - run: make ${{ matrix.target }}

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres redis

      - name: Stop test database
        if: always()
        run: docker compose down -v

  service-e2e:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - label: Service E2E A
            shard: 0
          - label: Service E2E B
            shard: 1
          - label: Service E2E C
            shard: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-service-e2e-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-service-e2e-

      - name: Install file tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep sed libcap2-bin
          make install-chroot-sandbox

      - uses: ./.github/actions/setup-test-db

      - run: make test-service-e2e SERVICE_E2E_SHARD_INDEX=${{ matrix.shard }} SERVICE_E2E_SHARD_TOTAL=3

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs postgres redis

      - name: Stop test database
        if: always()
        run: docker compose down -v
