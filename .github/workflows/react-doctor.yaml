name: React Doctor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Check pull request
        if: github.event_name == 'pull_request'
        env:
          REACT_DOCTOR_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run doctor --base "$REACT_DOCTOR_BASE" --verbose 2>&1 | tee "$RUNNER_TEMP/react-doctor.txt"

      - name: Check full workspace
        if: github.event_name != 'pull_request'
        run: pnpm run doctor --scope full --blocking none --verbose 2>&1 | tee "$RUNNER_TEMP/react-doctor.txt"

      - name: Publish report
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/react-doctor.txt" ]]; then
            {
              printf '## React Doctor\n\n```text\n'
              cat "$RUNNER_TEMP/react-doctor.txt"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
