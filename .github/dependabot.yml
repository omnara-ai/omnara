version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directories:
      - /
      - /observability
      - /tools/ci
      - /tools/goose
      - /tools/omnaralint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
