version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /
      - /examples/sharepoint-mount
      - /examples/unikraft-machine
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    groups:
      shared-docker-images:
        group-by: dependency-name
    ignore:
      - dependency-name: "*node"
        update-types:
          - version-update:semver-major
      - dependency-name: "*golang"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: valkey/valkey
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directories:
      - /
      - /observability
      - /tools/ci
      - /tools/goose
      - /tools/omnaralint
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 20
    allow:
      - dependency-type: direct
      # Dependabot skips Go tool dependencies: dependabot/dependabot-core#12050.
      - dependency-name: github.com/air-verse/air
        dependency-type: indirect
      - dependency-name: github.com/golangci/golangci-lint/v2
        dependency-type: indirect
      - dependency-name: github.com/oapi-codegen/oapi-codegen/v2
        dependency-type: indirect
      - dependency-name: github.com/oasdiff/oasdiff
        dependency-type: indirect
      - dependency-name: github.com/pressly/goose/v3
        dependency-type: indirect
      - dependency-name: github.com/sqlc-dev/sqlc
        dependency-type: indirect
      - dependency-name: golang.org/x/vuln
        dependency-type: indirect
    groups:
      aws-sdk-minor-and-patch:
        applies-to: version-updates
        patterns:
          - github.com/aws/aws-sdk-go-v2*
        update-types:
          - minor
          - patch
      golang-x-minor-and-patch:
        applies-to: version-updates
        patterns:
          - golang.org/x/*
        update-types:
          - minor
          - patch
      shared-go-dependencies:
        group-by: dependency-name
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directories:
      - /frontend
      - /examples/custom-tool-webhook
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/Los_Angeles
    groups:
      # Dependency-type filters can drop transitive fixes: dependabot/dependabot-core#16250.
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
