sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/storage/queries"
    rules:
      - users-deleted-at
      - orgs-deleted-at
      - projects-deleted-at
      - secrets-deleted-at
      - model-provider-configs-deleted-at
      - configured-models-deleted-at
      - agent-profiles-deleted-at
      - agent-profile-versions-deleted-at
      - integration-installs-deleted-at
      - integration-apps-deleted-at
      - integration-routes-deleted-at
      - integration-target-bindings-deleted-at
      - integration-runtime-units-deleted-at
      - integration-targets-deleted-at
      - machine-pools-deleted-at
      - machines-deleted-at
      - skills-deleted-at
      - skill-revisions-deleted-at
    gen:
      go:
        package: "dbsqlc"
        out: "internal/storage/internal/dbsqlc"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_json_tags: false
        emit_interface: false
        omit_unused_structs: true
        query_parameter_limit: 0
        output_db_file_name: "db_gen.go"
        output_models_file_name: "models_gen.go"
        overrides:
          - db_type: "pg_catalog.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          - db_type: "bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          - db_type: "pg_catalog.jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "pg_catalog.jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
  - engine: "sqlite"
    schema: "internal/machinedaemon/statedb/migrations"
    queries: "internal/machinedaemon/statedb/queries"
    database:
      # Build-time query validation only; omnarad opens a per-machine state.sqlite file.
      uri: ":memory:"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "dbsqlc"
        out: "internal/machinedaemon/statedb/internal/dbsqlc"
        sql_package: "database/sql"
        emit_empty_slices: false
        emit_interface: false
        omit_unused_structs: true
        query_parameter_limit: 0
        output_db_file_name: "db_gen.go"
        output_models_file_name: "models_gen.go"
