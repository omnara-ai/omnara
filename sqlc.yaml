version: "2"
rules:
  - name: users-deleted-at
    message: "users query must filter deleted_at (or annotate @sqlc-vet-disable users-deleted-at)"
    rule: >-
      query.sql.matches(r'(?i)\b(from|join|update)\s+users\b') && !query.sql.contains('deleted_at')
