server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/omnara;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript image/svg+xml text/css;

    error_page 404 = @omnara_not_found;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 404;
    }

    location ~ ^/(?:api|install|\.well-known)(?:/|$) {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/assets(?:/|$) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ~ \.[^/]+$ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    location = /index.html {
        try_files /index.html =404;
        charset utf-8;
        add_header Cache-Control no-cache;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-4Z+0IbR8cDetVQawCZYyJN7DAZJUmjFGeS+nwKwqD8c='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";
        add_header Referrer-Policy no-referrer;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    location @omnara_not_found {
        types {}
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
